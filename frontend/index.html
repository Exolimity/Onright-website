<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Per-page <title> and description are set by the <Seo> component. -->
    <title>Onright Digital — Websites voor ondernemers in Noord-Limburg</title>
    <meta name="theme-color" content="#faf8f5" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Onright Digital" />
    <meta property="og:locale" content="nl_NL" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Tells Google what kind of business this is and where it works (local search). -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ProfessionalService",
        "name": "Onright Digital",
        "description": "Webstudio uit Belfeld die websites maakt voor ondernemers in Noord-Limburg.",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Belfeld",
          "addressRegion": "Limburg",
          "addressCountry": "NL"
        },
        "areaServed": ["Belfeld", "Venlo", "Tegelen", "Blerick", "Reuver", "Beesel", "Kessel", "Noord-Limburg"],
        "knowsLanguage": "nl"
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
